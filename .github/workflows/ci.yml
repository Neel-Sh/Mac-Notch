name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the Claude Code hook script
        run: scripts/check-hook-script.sh

      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Brim.xcodeproj \
            -scheme Brim \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            | tee build/xcodebuild.log | grep -E "error:|warning:|Test case|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)"

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
